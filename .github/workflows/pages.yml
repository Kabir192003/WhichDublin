name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Forward the old address to the Vercel site (keeps ?settings and #/page)
        run: |
          mkdir -p dist
          cat > dist/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Which Dublin has moved</title>
          <meta name="robots" content="noindex">
          <script>location.replace('https://which-dublin.vercel.app/' + location.search + location.hash)</script>
          <p>Which Dublin has moved to <a href="https://which-dublin.vercel.app/">which-dublin.vercel.app</a>.</p>
          HTML
          cp dist/index.html dist/404.html
          printf "self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(self.registration.unregister()))" > dist/sw.js
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
